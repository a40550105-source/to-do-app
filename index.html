<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple to-do list to help you keep track of what matters."
    />
    <title>My To-do List</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="eyebrow">A little more focus</p>
        <h1>My to-do list<span>.</span></h1>
        <p class="subtitle">Make space for what matters today.</p>
      </header>

      <form class="task-form" id="task-form">
        <label class="sr-only" for="task-input">Add a task</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="What needs to get done?"
          maxlength="120"
          autocomplete="off"
          required
        />
        <button class="add-button" type="submit" aria-label="Add task">+</button>
      </form>

      <section class="task-panel" aria-label="Your tasks">
        <div class="task-toolbar">
          <p id="task-count" aria-live="polite">0 tasks left</p>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
        </div>
        <ul class="task-list" id="task-list"></ul>
        <div class="empty-state" id="empty-state">
          <span class="empty-icon" aria-hidden="true">✦</span>
          <p id="empty-message">Your list is clear. Add a task to get started.</p>
        </div>
        <div class="list-footer">
          <span id="list-hint">Small steps count.</span>
          <button class="clear-button" id="clear-completed" type="button" hidden>
            Clear completed
          </button>
        </div>
      </section>
      <p class="made-for">One thing at a time.</p>
    </main>
  </body>
</html>
